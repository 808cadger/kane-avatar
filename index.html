<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aria — AI Companion</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d0d1a; --panel-bg: #11111f; --surface: #1a1a2e;
  --border: #2a2a45; --accent: #6c63ff; --accent2: #ff6b9d;
  --text: #e8e8f0; --muted: #7070a0; --glow: rgba(108,99,255,0.4);
}
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; height:100vh; }

/* ── AVATAR PANEL ── */
#avatar-panel {
  width:48%; position:relative; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end;
  background: radial-gradient(ellipse at 50% 30%, #1a1040 0%, #0d0d1a 70%);
  border-right:1px solid var(--border); overflow:hidden;
}
#stage-bg {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 70% 35% at 50% 85%, rgba(108,99,255,0.14) 0%, transparent 65%),
    radial-gradient(ellipse 50% 50% at 25% 20%, rgba(255,107,157,0.05) 0%, transparent 55%),
    radial-gradient(ellipse 40% 60% at 75% 15%, rgba(108,99,255,0.04) 0%, transparent 55%);
}
/* Stage floor lines — perspective grid */
#stage-floor {
  position:absolute; bottom:0; left:0; right:0; height:220px;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(108,99,255,0.06) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(108,99,255,0.04) 60px),
    linear-gradient(to top, rgba(108,99,255,0.1), transparent);
}
#avatar-name {
  position:absolute; top:22px; left:0; right:0;
  text-align:center; font-size:12px; letter-spacing:4px;
  text-transform:uppercase; color:var(--muted); z-index:10;
}
#avatar-status {
  position:absolute; bottom:114px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:8px; font-size:12px;
  color:var(--muted); z-index:10; transition:color 0.3s; white-space:nowrap;
}
#status-dot {
  width:8px; height:8px; border-radius:50%; background:#4caf50;
  box-shadow:0 0 8px #4caf50; animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.8)} }

#avatar-svg-wrap {
  position:relative; z-index:5; margin-bottom:60px;
}
#avatar-svg-wrap.speaking::after {
  content:''; position:absolute; inset:-24px; border-radius:50%;
  background:radial-gradient(circle, rgba(108,99,255,.28) 0%, transparent 70%);
  animation:speak-glow .5s ease-in-out infinite alternate; pointer-events:none;
}
@keyframes speak-glow { from{opacity:.4;transform:scale(.96)} to{opacity:1;transform:scale(1.04)} }

/* ── SVG keyframe library ── */

/* Whole body */
@keyframes body-idle   { 0%,100%{transform:rotate(0deg) translateY(0)}  30%{transform:rotate(.35deg) translateY(-2px)} 70%{transform:rotate(-.3deg) translateY(1px)} }
@keyframes body-walk   { 0%,100%{transform:translateX(0) rotate(0deg)}   25%{transform:translateX(-6px) rotate(-.4deg)} 75%{transform:translateX(6px) rotate(.4deg)} }

/* Chest breathe */
@keyframes breathe     { 0%,100%{transform:scaleY(1) translateY(0)} 45%{transform:scaleY(1.013) translateY(-1px)} }

/* Head */
@keyframes head-idle   { 0%,100%{transform:rotate(0deg) translateX(0)} 33%{transform:rotate(.7deg) translateX(2px)} 66%{transform:rotate(-.5deg) translateX(-1px)} }
@keyframes head-nod    { 0%,100%{transform:rotate(0deg)} 30%{transform:rotate(2deg)} 70%{transform:rotate(-1.2deg)} }
@keyframes head-think  { 0%,100%{transform:rotate(0deg) translateX(0)} 50%{transform:rotate(-2deg) translateX(-4px)} }

/* Arms — idle float */
@keyframes arm-l-idle  { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(2deg) translateY(-3px)} }
@keyframes arm-r-idle  { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-2deg) translateY(-3px)} }

/* Arms — walk swing */
@keyframes arm-l-walk  { 0%,100%{transform:rotate(-22deg)} 50%{transform:rotate(22deg)} }
@keyframes arm-r-walk  { 0%,100%{transform:rotate(22deg)}  50%{transform:rotate(-22deg)} }

/* Wave (right arm) */
@keyframes wave        { 0%{transform:rotate(-10deg)} 20%{transform:rotate(-50deg)} 40%{transform:rotate(-10deg)} 60%{transform:rotate(-50deg)} 80%{transform:rotate(-10deg)} 100%{transform:rotate(-10deg)} }
/* Forearm wave */
@keyframes forearm-wave{ 0%{transform:rotate(0deg)} 25%{transform:rotate(-30deg)} 75%{transform:rotate(30deg)} 100%{transform:rotate(0deg)} }

/* Point (right arm extends forward/up) */
@keyframes point-upper { 0%,100%{transform:rotate(-65deg)} }
@keyframes point-fore  { 0%,100%{transform:rotate(-30deg)} }

/* Legs — idle subtle weight shift */
@keyframes leg-l-idle  { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(.8deg)} }
@keyframes leg-r-idle  { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-.8deg)} }

/* Legs — walk cycle */
@keyframes leg-l-walk  { 0%,100%{transform:rotate(-24deg)} 50%{transform:rotate(24deg)} }
@keyframes leg-r-walk  { 0%,100%{transform:rotate(24deg)}  50%{transform:rotate(-24deg)} }
@keyframes shin-l-walk { 0%{transform:rotate(0deg)} 25%{transform:rotate(20deg)} 75%{transform:rotate(-5deg)} 100%{transform:rotate(0deg)} }
@keyframes shin-r-walk { 0%{transform:rotate(0deg)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }

/* Hair */
@keyframes hair-flow   { 0%,100%{transform:skewX(0)} 50%{transform:skewX(.6deg)} }

/* Classes applied by JS */
.body-group   { transform-origin:200px 580px; animation:body-idle 5s ease-in-out infinite; }
.body-group.walking { animation:body-walk .55s ease-in-out infinite; }

.chest-group  { transform-origin:200px 420px; animation:breathe 4.5s ease-in-out infinite; }

.head-group   { transform-origin:200px 250px; animation:head-idle 7s ease-in-out infinite; }
.head-group.talking { animation:head-nod .42s ease-in-out infinite; }
.head-group.thinking{ animation:head-think 2s ease-in-out infinite; }

.hair-group   { transform-origin:200px 195px; animation:hair-flow 4s ease-in-out infinite; }

.arm-l-upper  { transform-origin:138px 378px; animation:arm-l-idle 4s ease-in-out infinite; }
.arm-r-upper  { transform-origin:262px 378px; animation:arm-r-idle 4s ease-in-out infinite reverse; }
.arm-l-upper.walking { animation:arm-l-walk .55s ease-in-out infinite; }
.arm-r-upper.walking { animation:arm-r-walk .55s ease-in-out infinite; }
.arm-r-upper.waving  { animation:wave 1.2s ease-in-out 3 forwards; transform-origin:262px 378px; }
.arm-r-upper.pointing{ animation:point-upper .1s ease forwards; }

.arm-l-fore   { transform-origin:118px 430px; }
.arm-r-fore   { transform-origin:278px 430px; }
.arm-r-fore.waving   { animation:forearm-wave 1.2s ease-in-out 3 forwards; }
.arm-r-fore.pointing { animation:point-fore .1s ease forwards; }

.leg-l-upper  { transform-origin:178px 510px; animation:leg-l-idle 5s ease-in-out infinite; }
.leg-r-upper  { transform-origin:222px 510px; animation:leg-r-idle 5s ease-in-out infinite reverse; }
.leg-l-upper.walking { animation:leg-l-walk .55s ease-in-out infinite; }
.leg-r-upper.walking { animation:leg-r-walk .55s ease-in-out infinite; }

.leg-l-shin   { transform-origin:170px 572px; }
.leg-r-shin   { transform-origin:230px 572px; }
.leg-l-shin.walking  { animation:shin-l-walk .55s ease-in-out infinite; }
.leg-r-shin.walking  { animation:shin-r-walk .55s ease-in-out infinite; }

/* ── RIGHT PANEL ── */
#interface-panel { width:52%; display:flex; flex-direction:column; background:var(--panel-bg); }
#panel-header { display:flex; align-items:center; gap:8px; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
#panel-header h1 { font-size:16px; font-weight:600; }
.mode-tabs { display:flex; gap:4px; margin-left:auto; }
.tab-btn { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; cursor:pointer; transition:all .2s; }
.tab-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
#api-bar { display:flex; gap:8px; padding:10px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
#api-key-input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 12px; color:var(--text); font-size:12px; font-family:monospace; }
#api-key-input:focus { outline:none; border-color:var(--accent); }
#save-key-btn { padding:7px 14px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:12px; cursor:pointer; }
#content-area { flex:1; overflow:hidden; position:relative; }
#chat-view { position:absolute; inset:0; display:none; flex-direction:column; }
#chat-view.active { display:flex; }
#chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
#chat-messages::-webkit-scrollbar { width:4px; }
#chat-messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.message { display:flex; gap:10px; align-items:flex-start; animation:msg-in .25s ease; }
@keyframes msg-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.message.user { flex-direction:row-reverse; }
.msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
.message.assistant .msg-avatar { background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.message.user .msg-avatar { background:var(--surface); border:1px solid var(--border); }
.msg-bubble { max-width:78%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.55; }
.message.assistant .msg-bubble { background:var(--surface); border:1px solid var(--border); border-top-left-radius:4px; }
.message.user .msg-bubble { background:var(--accent); border-top-right-radius:4px; color:#fff; }
.typing-indicator { display:flex; gap:5px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; border-top-left-radius:4px; width:fit-content; }
.typing-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:typing-bounce 1.2s ease-in-out infinite; }
.typing-dot:nth-child(2){animation-delay:.2s} .typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typing-bounce { 0%,80%,100%{transform:translateY(0);opacity:.5} 40%{transform:translateY(-6px);opacity:1} }
#app-view { position:absolute; inset:0; display:none; flex-direction:column; }
#app-view.active { display:flex; }
#url-bar { display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
#url-input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 12px; color:var(--text); font-size:13px; }
#url-input:focus { outline:none; border-color:var(--accent); }
#load-url-btn { padding:7px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:12px; cursor:pointer; transition:background .2s; }
#load-url-btn:hover { background:var(--border); }
#app-frame-wrap { flex:1; position:relative; overflow:hidden; }
#app-frame { width:100%; height:100%; border:none; background:#fff; }
#no-app-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:14px; }
#no-app-placeholder .icon { font-size:48px; opacity:.3; }
#input-bar { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center; flex-shrink:0; background:var(--panel-bg); }
#mic-btn { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:16px; cursor:pointer; flex-shrink:0; transition:all .2s; display:flex; align-items:center; justify-content:center; }
#mic-btn.listening { background:#ff4444; border-color:#ff4444; color:#fff; animation:mic-pulse .8s ease-in-out infinite; }
@keyframes mic-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.4)} 50%{box-shadow:0 0 0 8px rgba(255,68,68,0)} }
#text-input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:10px 18px; color:var(--text); font-size:14px; resize:none; line-height:1.4; max-height:100px; overflow-y:auto; }
#text-input:focus { outline:none; border-color:var(--accent); }
#text-input::placeholder { color:var(--muted); }
#send-btn { width:40px; height:40px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; flex-shrink:0; transition:transform .15s,opacity .15s; display:flex; align-items:center; justify-content:center; }
#send-btn:hover{transform:scale(1.08)} #send-btn:active{transform:scale(.94)}
#speak-toggle { width:36px; height:20px; border-radius:10px; background:var(--border); border:none; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; }
#speak-toggle.on{background:var(--accent)}
#speak-toggle::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s; }
#speak-toggle.on::after{transform:translateX(16px)}
#voice-label{font-size:11px;color:var(--muted)}
#tts-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
</style>
</head>
<body>
<div id="app">

<!-- ── AVATAR PANEL ── -->
<div id="avatar-panel">
  <div id="stage-bg"></div>
  <div id="stage-floor"></div>
  <div id="avatar-name">ARIA · AI COMPANION</div>

  <div id="avatar-svg-wrap">
    <svg id="avatar-svg" viewBox="0 0 400 700" width="300" height="525"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sg" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#f5c5a0"/>
          <stop offset="100%" stop-color="#d4956a"/>
        </radialGradient>
        <radialGradient id="sg2" cx="50%" cy="30%" r="60%">
          <stop offset="0%" stop-color="#f0b890"/>
          <stop offset="100%" stop-color="#c8855e"/>
        </radialGradient>
        <radialGradient id="cg" cx="50%" cy="0%" r="90%">
          <stop offset="0%" stop-color="#4a4a8a"/>
          <stop offset="100%" stop-color="#1e1e40"/>
        </radialGradient>
        <radialGradient id="eg" cx="35%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#7c6ff5"/>
          <stop offset="60%" stop-color="#3d38a0"/>
          <stop offset="100%" stop-color="#1a1850"/>
        </radialGradient>
        <radialGradient id="pg" cx="50%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#3a5a8a"/>
          <stop offset="100%" stop-color="#162035"/>
        </radialGradient>
        <filter id="fs">
          <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(0,0,0,.55)"/>
        </filter>
        <filter id="gf">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- ── FULL BODY GROUP ── -->
      <g class="body-group" filter="url(#fs)">

        <!-- ── LEFT ARM (behind torso) ── -->
        <g class="arm-l-upper">
          <!-- upper arm sleeve -->
          <path d="M 138 378 C 118 400 108 428 112 458" stroke="#2a2a55" stroke-width="34" stroke-linecap="round" fill="none"/>
          <path d="M 138 378 C 118 400 108 428 112 458" stroke="url(#cg)" stroke-width="28" stroke-linecap="round" fill="none"/>
          <g class="arm-l-fore" style="transform-origin:112px 458px">
            <!-- forearm -->
            <path d="M 112 458 C 104 478 100 502 102 522" stroke="url(#sg2)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <!-- hand -->
            <ellipse cx="102" cy="530" rx="16" ry="20" fill="url(#sg2)" transform="rotate(-8 102 530)"/>
            <path d="M 94 524 C 90 518 88 512 92 508" stroke="url(#sg)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/>
            <path d="M 100 525 C 96 518 95 510 99 506" stroke="url(#sg)" stroke-width="4" stroke-linecap="round" fill="none" opacity=".5"/>
          </g>
        </g>

        <!-- ── CHEST / TORSO ── -->
        <g class="chest-group">

          <!-- Torso clothing -->
          <path d="M 112 385 C 96 425 92 480 98 560 L 302 560 C 308 480 304 425 288 385
                   C 262 368 234 360 200 360 C 166 360 138 368 112 385 Z"
                fill="url(#cg)"/>

          <!-- Torso fabric shading -->
          <path d="M 156 370 L 200 412 L 244 370" stroke="#6060b0" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
          <path d="M 112 385 C 140 373 168 364 200 362 C 232 364 260 373 288 385"
                stroke="#5050a0" stroke-width="1" fill="none" opacity=".6"/>

          <!-- Belt / waist -->
          <rect x="112" y="490" width="176" height="16" rx="4" fill="#141430" opacity=".7"/>
          <rect x="192" y="490" width="16" height="16" rx="3" fill="#3a3a6e"/>

          <!-- Neck -->
          <rect x="182" y="342" width="36" height="28" rx="12" fill="url(#sg)"/>

          <!-- Shoulder patches -->
          <ellipse cx="120" cy="378" rx="18" ry="10" fill="#5050a0" opacity=".5"/>
          <ellipse cx="280" cy="378" rx="18" ry="10" fill="#5050a0" opacity=".5"/>
        </g>

        <!-- ── RIGHT ARM (in front) ── -->
        <g id="arm-r-group" class="arm-r-upper">
          <path id="arm-r-upper-path" d="M 262 378 C 282 400 292 428 288 458" stroke="#2a2a55" stroke-width="34" stroke-linecap="round" fill="none"/>
          <path d="M 262 378 C 282 400 292 428 288 458" stroke="url(#cg)" stroke-width="28" stroke-linecap="round" fill="none"/>
          <g id="arm-r-fore-group" class="arm-r-fore" style="transform-origin:288px 458px">
            <path d="M 288 458 C 296 478 300 502 298 522" stroke="url(#sg2)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <!-- hand / fingers -->
            <ellipse cx="298" cy="530" rx="16" ry="20" fill="url(#sg2)" transform="rotate(8 298 530)"/>
            <path d="M 304 524 C 308 518 310 512 306 508" stroke="url(#sg)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/>
            <path d="M 298 525 C 302 518 303 510 299 506" stroke="url(#sg)" stroke-width="4" stroke-linecap="round" fill="none" opacity=".5"/>
            <!-- pointing finger (hidden by default) -->
            <path id="point-finger" d="M 296 520 L 318 496" stroke="url(#sg)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0"/>
          </g>
        </g>

        <!-- ── LEFT LEG ── -->
        <g class="leg-l-upper">
          <path d="M 152 556 C 148 590 146 618 148 648" stroke="#1a2a4a" stroke-width="46" stroke-linecap="round" fill="none"/>
          <path d="M 152 556 C 148 590 146 618 148 648" stroke="url(#pg)" stroke-width="38" stroke-linecap="round" fill="none"/>
          <g class="leg-l-shin">
            <!-- shin -->
            <path d="M 148 648 C 146 670 145 688 144 706" stroke="url(#pg)" stroke-width="32" stroke-linecap="round" fill="none"/>
            <!-- shoe -->
            <path d="M 128 706 C 124 706 116 708 112 714 C 110 718 118 722 136 722 C 158 722 168 718 166 712 C 164 706 152 706 144 706 Z"
                  fill="#1a1a1a"/>
            <path d="M 128 706 C 124 706 118 706 114 710" stroke="#333" stroke-width="2" fill="none"/>
          </g>
        </g>

        <!-- ── RIGHT LEG ── -->
        <g class="leg-r-upper">
          <path d="M 248 556 C 252 590 254 618 252 648" stroke="#1a2a4a" stroke-width="46" stroke-linecap="round" fill="none"/>
          <path d="M 248 556 C 252 590 254 618 252 648" stroke="url(#pg)" stroke-width="38" stroke-linecap="round" fill="none"/>
          <g class="leg-r-shin">
            <path d="M 252 648 C 254 670 255 688 256 706" stroke="url(#pg)" stroke-width="32" stroke-linecap="round" fill="none"/>
            <!-- shoe -->
            <path d="M 236 706 C 240 706 272 706 278 706 C 284 706 286 710 284 714 C 282 718 272 722 254 722 C 236 722 228 718 230 712 C 232 706 236 706 256 706 Z"
                  fill="#1a1a1a"/>
            <path d="M 272 706 C 276 706 282 707 284 710" stroke="#333" stroke-width="2" fill="none"/>
          </g>
        </g>

        <!-- ── HEAD GROUP ── -->
        <g class="head-group" id="head-group">

          <!-- Hair back -->
          <g class="hair-group">
            <path d="M 122 235 C 116 178 126 135 148 118 C 160 110 174 105 200 103
                     C 226 105 240 110 252 118 C 274 135 284 178 278 235"
                  fill="#1a1414" opacity=".75"/>
            <path d="M 120 250 C 110 278 112 320 120 348" fill="#222" opacity=".9"/>
            <path d="M 280 250 C 290 278 288 320 280 348" fill="#222" opacity=".9"/>
          </g>

          <!-- Head -->
          <ellipse cx="200" cy="225" rx="88" ry="106" fill="url(#sg)"/>

          <!-- Hair front -->
          <g class="hair-group">
            <path d="M 114 212 C 110 176 118 140 132 122 C 148 105 172 96 200 95
                     C 228 96 252 105 268 122 C 282 140 290 176 286 212
                     C 278 190 268 177 254 170 C 238 162 222 158 200 158
                     C 178 158 162 162 146 170 C 132 177 122 190 114 212 Z"
                  fill="#1a1414"/>
            <path d="M 146 108 C 160 100 180 96 200 95 C 175 97 157 106 146 108 Z" fill="#333" opacity=".5"/>
            <path d="M 132 165 C 144 150 158 140 174 136 C 158 146 144 158 140 172" fill="#2a2020" opacity=".8"/>
          </g>

          <!-- Cheek blush -->
          <ellipse cx="148" cy="258" rx="20" ry="12" fill="#e8957a" opacity=".22"/>
          <ellipse cx="252" cy="258" rx="20" ry="12" fill="#e8957a" opacity=".22"/>

          <!-- Eyebrows -->
          <path d="M 152 193 Q 168 187 183 191" stroke="#2a1a14" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M 217 191 Q 232 187 248 193" stroke="#2a1a14" stroke-width="3.5" stroke-linecap="round" fill="none"/>

          <!-- Eye sockets -->
          <ellipse cx="168" cy="218" rx="23" ry="19" fill="#c07050" opacity=".12"/>
          <ellipse cx="232" cy="218" rx="23" ry="19" fill="#c07050" opacity=".12"/>

          <!-- Eye whites -->
          <ellipse cx="168" cy="218" rx="21" ry="17" fill="white"/>
          <ellipse cx="232" cy="218" rx="21" ry="17" fill="white"/>

          <!-- Irises -->
          <g class="eye-l" id="iris-l" style="transform-origin:168px 218px">
            <ellipse cx="168" cy="218" rx="14" ry="15" fill="url(#eg)"/>
            <ellipse cx="168" cy="218" rx="7.5" ry="8.5" fill="#0d0a30"/>
            <ellipse cx="172" cy="214" rx="4" ry="3" fill="white" opacity=".92"/>
            <ellipse cx="163" cy="222" rx="1.5" ry="1.5" fill="white" opacity=".5"/>
          </g>
          <g class="eye-r" id="iris-r" style="transform-origin:232px 218px">
            <ellipse cx="232" cy="218" rx="14" ry="15" fill="url(#eg)"/>
            <ellipse cx="232" cy="218" rx="7.5" ry="8.5" fill="#0d0a30"/>
            <ellipse cx="236" cy="214" rx="4" ry="3" fill="white" opacity=".92"/>
            <ellipse cx="227" cy="222" rx="1.5" ry="1.5" fill="white" opacity=".5"/>
          </g>

          <!-- Eyelids -->
          <g id="eyelid-l" style="transform-origin:168px 210px;transform:scaleY(0)">
            <ellipse cx="168" cy="218" rx="22" ry="18" fill="#e8a882"/>
          </g>
          <g id="eyelid-r" style="transform-origin:232px 210px;transform:scaleY(0)">
            <ellipse cx="232" cy="218" rx="22" ry="18" fill="#e8a882"/>
          </g>

          <!-- Nose -->
          <path d="M 197 226 C 194 240 191 250 187 254 C 193 257 207 257 213 254 C 209 250 206 240 203 226"
                stroke="#c07050" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".6"/>
          <ellipse cx="192" cy="254" rx="5" ry="3.5" fill="#c07050" opacity=".28"/>
          <ellipse cx="208" cy="254" rx="5" ry="3.5" fill="#c07050" opacity=".28"/>

          <!-- Mouth -->
          <g id="mouth-group">
            <path d="M 176 281 C 182 276 192 274 200 275 C 208 274 218 276 224 281"
                  stroke="#a0604a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path id="mouth-main" d="M 176 285 Q 200 296 224 285"
                  stroke="#8a4a38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <ellipse id="mouth-open" cx="200" cy="288" rx="19" ry="8" fill="#4a1010" opacity="0"/>
            <path d="M 178 289 Q 200 300 222 289 Q 212 304 200 305 Q 188 304 178 289 Z"
                  fill="#c07060" opacity=".38"/>
          </g>

          <!-- Ears -->
          <ellipse cx="114" cy="228" rx="12" ry="18" fill="url(#sg)"/>
          <path d="M 118 218 C 117 226 117 234 118 240" stroke="#c07050" stroke-width="2" stroke-linecap="round" fill="none" opacity=".4"/>
          <ellipse cx="286" cy="228" rx="12" ry="18" fill="url(#sg)"/>
          <path d="M 282 218 C 283 226 283 234 282 240" stroke="#c07050" stroke-width="2" stroke-linecap="round" fill="none" opacity=".4"/>

        </g><!-- /head-group -->

      </g><!-- /body-group -->

      <!-- Floor shadow -->
      <ellipse cx="200" cy="726" rx="100" ry="10" fill="rgba(0,0,0,.4)"/>
    </svg>
  </div>

  <div id="avatar-status">
    <div id="status-dot"></div>
    <span id="status-text">Ready</span>
  </div>
</div>

<!-- ── INTERFACE PANEL ── -->
<div id="interface-panel">
  <div id="panel-header">
    <h1>AI Companion</h1>
    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-chat" onclick="switchMode('chat')">💬 Chat</button>
      <button class="tab-btn" id="tab-app" onclick="switchMode('app')">🖥️ App Guide</button>
    </div>
  </div>
  <div id="api-bar">
    <input type="password" id="api-key-input" placeholder="sk-ant-… (Anthropic API key)"/>
    <button id="save-key-btn" onclick="saveKey()">Save</button>
  </div>
  <div id="content-area">
    <div id="chat-view" class="active">
      <div id="chat-messages">
        <div class="message assistant">
          <div class="msg-avatar">✨</div>
          <div class="msg-bubble">
            Hi! I'm Aria. I can chat, answer questions, or switch to <strong>App Guide</strong> mode to walk you through any web app step by step.
          </div>
        </div>
      </div>
    </div>
    <div id="app-view">
      <div id="url-bar">
        <input type="url" id="url-input" placeholder="https://example.com — load any app for guided help"/>
        <button id="load-url-btn" onclick="loadApp()">Load →</button>
      </div>
      <div id="app-frame-wrap">
        <div id="no-app-placeholder">
          <div class="icon">🖥️</div>
          <div>Enter a URL above to load an app</div>
          <div style="font-size:12px;margin-top:4px">Then ask Aria to guide you through it</div>
        </div>
        <iframe id="app-frame" style="display:none" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </div>
  </div>
  <div id="input-bar">
    <button id="mic-btn" onclick="toggleMic()" title="Voice input">🎤</button>
    <textarea id="text-input" rows="1" placeholder="Ask anything… or say 'wave hello' to test"
              onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <div id="tts-controls">
      <span id="voice-label">Voice</span>
      <button id="speak-toggle" class="on" onclick="toggleSpeak()"></button>
    </div>
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>
</div>

<script>
// ── State ──
const S = {
  apiKey: localStorage.getItem('aria_key') || '',
  mode: 'chat', speaking: false, listening: false,
  voiceEnabled: true, talkingInterval: null,
  messages: [], currentGesture: null,
};

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  if (S.apiKey) document.getElementById('api-key-input').value = '•'.repeat(20);
  S.voiceEnabled = localStorage.getItem('aria_voice') !== 'off';
  document.getElementById('speak-toggle').className = S.voiceEnabled ? 'on' : '';
  startBlinkLoop();
  startEyeTracking();
  setTimeout(() => {
    playGesture('wave');
    if (S.voiceEnabled) {
      setTimeout(() => speakText("Hi! I'm Aria. How can I help you today?"), 400);
    }
  }, 600);
});

// ── API Key ──
function saveKey() {
  const v = document.getElementById('api-key-input').value.trim();
  if (v && !v.startsWith('•')) {
    S.apiKey = v;
    localStorage.setItem('aria_key', v);
    document.getElementById('api-key-input').value = '•'.repeat(20);
    showStatus('Key saved ✓');
  }
}

// ── Mode ──
function switchMode(m) {
  S.mode = m;
  document.getElementById('chat-view').className = m === 'chat' ? 'active' : '';
  document.getElementById('app-view').className  = m === 'app'  ? 'active' : '';
  document.getElementById('tab-chat').className  = 'tab-btn' + (m === 'chat' ? ' active' : '');
  document.getElementById('tab-app').className   = 'tab-btn' + (m === 'app'  ? ' active' : '');
}

// ── Gesture engine ──
// gesture names: 'idle' | 'wave' | 'point' | 'walk' | 'talking' | 'thinking' | 'listening'
function playGesture(name, durationMs) {
  if (S.currentGesture === name) return;
  clearGestures();
  S.currentGesture = name;

  const body   = document.querySelector('.body-group');
  const armLU  = document.querySelector('.arm-l-upper');
  const armRU  = document.querySelector('.arm-r-upper');
  const armRF  = document.querySelector('.arm-r-fore');
  const legLU  = document.querySelector('.leg-l-upper');
  const legRU  = document.querySelector('.leg-r-upper');
  const legLS  = document.querySelector('.leg-l-shin');
  const legRS  = document.querySelector('.leg-r-shin');
  const head   = document.getElementById('head-group');
  const pf     = document.getElementById('point-finger');

  if (name === 'wave') {
    armRU.classList.add('waving');
    armRF.classList.add('waving');
    if (durationMs) setTimeout(() => playGesture('idle'), durationMs);
    else setTimeout(() => playGesture('idle'), 3800);
  }
  else if (name === 'point') {
    armRU.style.animation = 'none';
    armRF.style.animation = 'none';
    armRU.style.transform = 'rotate(-62deg)';
    armRF.style.transform = 'rotate(-28deg)';
    pf.style.opacity = '1';
    if (durationMs) setTimeout(() => playGesture('idle'), durationMs);
    else setTimeout(() => playGesture('idle'), 2500);
  }
  else if (name === 'walk') {
    body.classList.add('walking');
    armLU.classList.add('walking');
    armRU.classList.add('walking');
    legLU.classList.add('walking');
    legRU.classList.add('walking');
    legLS.classList.add('walking');
    legRS.classList.add('walking');
    if (durationMs) setTimeout(() => playGesture('idle'), durationMs);
  }
  else if (name === 'talking') {
    head.classList.add('talking');
    document.getElementById('avatar-svg-wrap').classList.add('speaking');
    setStatus('Speaking…', '#6c63ff');
    let m = 0;
    S.talkingInterval = setInterval(() => {
      m = (m + 1) % 4;
      setMouth([0, .7, 1, .4][m]);
    }, 115);
  }
  else if (name === 'thinking') {
    head.classList.add('thinking');
    setStatus('Thinking…', '#ffaa00');
    shiftEyes(-5, 0, 1200);
  }
  else if (name === 'listening') {
    setStatus('Listening…', '#ff4444');
  }
  else { // idle
    setStatus('Ready', '#4caf50');
    S.currentGesture = 'idle';
  }
}

function clearGestures() {
  clearInterval(S.talkingInterval);
  setMouth(0);

  const head  = document.getElementById('head-group');
  const body  = document.querySelector('.body-group');
  const armLU = document.querySelector('.arm-l-upper');
  const armRU = document.querySelector('.arm-r-upper');
  const armRF = document.querySelector('.arm-r-fore');
  const legLU = document.querySelector('.leg-l-upper');
  const legRU = document.querySelector('.leg-r-upper');
  const legLS = document.querySelector('.leg-l-shin');
  const legRS = document.querySelector('.leg-r-shin');
  const pf    = document.getElementById('point-finger');
  const wrap  = document.getElementById('avatar-svg-wrap');

  head.classList.remove('talking','thinking');
  wrap.classList.remove('speaking');
  body.classList.remove('walking');
  armLU.classList.remove('walking','waving');
  armRU.classList.remove('walking','waving','pointing');
  armRF.classList.remove('waving','pointing');
  legLU.classList.remove('walking');
  legRU.classList.remove('walking');
  legLS.classList.remove('walking');
  legRS.classList.remove('walking');

  // Reset inline styles from point gesture
  armRU.style.animation = '';
  armRU.style.transform = '';
  armRF.style.animation = '';
  armRF.style.transform = '';
  pf.style.opacity = '0';
}

function setMouth(a) {
  const mo = document.getElementById('mouth-open');
  const mm = document.getElementById('mouth-main');
  if (!mo) return;
  mo.style.opacity = a * .9;
  mo.setAttribute('ry', 4 + a * 10);
  const y = a * 4;
  mm.setAttribute('d', `M 176 ${285 - y} Q 200 ${296 - y * .5} 224 ${285 - y}`);
}

function setStatus(txt, color) {
  document.getElementById('status-text').textContent = txt;
  const d = document.getElementById('status-dot');
  d.style.background = color;
  d.style.boxShadow = `0 0 8px ${color}`;
}

function shiftEyes(dx, dy, ms) {
  ['iris-l','iris-r'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.transition = 'transform .5s ease'; el.style.transform = `translate(${dx}px,${dy}px)`; }
  });
  if (ms) setTimeout(() => shiftEyes(0, 0, 0), ms);
}

// ── Blink loop ──
function startBlinkLoop() {
  function blink() {
    const l = document.getElementById('eyelid-l');
    const r = document.getElementById('eyelid-r');
    if (!l) return;
    l.style.transition = r.style.transition = 'transform .07s ease-in';
    l.style.transform = r.style.transform = 'scaleY(1)';
    setTimeout(() => {
      l.style.transition = r.style.transition = 'transform .1s ease-out';
      l.style.transform = r.style.transform = 'scaleY(0)';
    }, 90);
    setTimeout(blink, 3000 + Math.random() * 5000);
  }
  setTimeout(blink, 2000 + Math.random() * 3000);
}

// ── Eye tracking ──
function startEyeTracking() {
  const wrap = document.getElementById('avatar-svg-wrap');
  document.addEventListener('mousemove', e => {
    const r = wrap.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height * .38;
    const dx = (e.clientX - cx) / (window.innerWidth / 2);
    const dy = (e.clientY - cy) / (window.innerHeight / 2);
    const mx = Math.max(-4.5, Math.min(4.5, dx * 5.5));
    const my = Math.max(-3.5, Math.min(3.5, dy * 4.5));

    ['iris-l','iris-r'].forEach(id => {
      const el = document.getElementById(id);
      if (el && S.currentGesture !== 'thinking') {
        el.style.transition = 'transform .08s ease-out';
        el.style.transform = `translate(${mx}px,${my}px)`;
      }
    });

    const head = document.getElementById('head-group');
    if (head && !['talking','thinking'].includes(S.currentGesture)) {
      head.style.transform = `rotate(${dx * 1.8}deg) translateX(${dx * 2.5}px)`;
    }
  });
}

// ── TTS ──
function speakText(txt) {
  if (!S.voiceEnabled) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v =>
    v.name.includes('Samantha') || v.name.includes('Google UK English Female') ||
    v.name.includes('Microsoft Zira') || v.name.includes('Karen') ||
    (v.lang === 'en-US' && v.localService)
  ) || voices.find(v => v.lang.startsWith('en'));
  if (pref) u.voice = pref;
  u.rate = 1.0; u.pitch = 1.05; u.volume = .9;
  u.onstart = () => { S.speaking = true; playGesture('talking'); };
  u.onend = u.onerror = () => { S.speaking = false; playGesture('idle'); };
  window.speechSynthesis.speak(u);
}
function toggleSpeak() {
  S.voiceEnabled = !S.voiceEnabled;
  localStorage.setItem('aria_voice', S.voiceEnabled ? 'on' : 'off');
  document.getElementById('speak-toggle').className = S.voiceEnabled ? 'on' : '';
  if (!S.voiceEnabled) window.speechSynthesis.cancel();
}

// ── ASR ──
let recognition = null;
function setupASR() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false; r.interimResults = true; r.lang = 'en-US';
  r.onresult = e => {
    let t = '';
    for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
    document.getElementById('text-input').value = t;
    autoResize(document.getElementById('text-input'));
    if (e.results[e.results.length - 1].isFinal) { stopListening(); if (t.trim()) sendMessage(); }
  };
  r.onerror = r.onend = () => { if (S.listening) stopListening(); };
  return r;
}
function toggleMic() {
  if (S.listening) { stopListening(); return; }
  if (!recognition) recognition = setupASR();
  if (!recognition) { addMsg('assistant','Speech recognition needs Chrome.'); return; }
  window.speechSynthesis.cancel();
  S.listening = true;
  document.getElementById('mic-btn').classList.add('listening');
  playGesture('listening');
  try { recognition.start(); } catch(e) { stopListening(); }
}
function stopListening() {
  S.listening = false;
  document.getElementById('mic-btn').classList.remove('listening');
  playGesture('idle');
  try { if (recognition) recognition.stop(); } catch(e) {}
}

// ── Chat ──
function handleKey(e) { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }

async function sendMessage() {
  const inp = document.getElementById('text-input');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg('user', txt);
  S.messages.push({ role:'user', content:txt });

  // Local gesture triggers
  const lower = txt.toLowerCase();
  if (lower.includes('wave') || lower.includes('hello') || lower.includes('hi')) {
    playGesture('wave'); setTimeout(() => {}, 100);
  } else if (lower.includes('point') || lower.includes('look at') || lower.includes('here')) {
    playGesture('point');
  } else if (lower.includes('walk') || lower.includes('come here') || lower.includes('move')) {
    playGesture('walk', 3000);
  } else {
    playGesture('thinking');
  }

  const tid = showTyping();
  try {
    const reply = await callClaude(txt);
    removeTyping(tid);
    addMsg('assistant', reply);
    S.messages.push({ role:'assistant', content:reply });
    // Pick gesture based on first word of reply
    const rLow = reply.toLowerCase();
    if (rLow.match(/^(hello|hi|hey|greetings)/)) {
      playGesture('wave');
      setTimeout(() => speakText(reply.replace(/\*\*/g,'').replace(/#{1,3} /g,'').slice(0,400)), 200);
    } else {
      speakText(reply.replace(/\*\*/g,'').replace(/#{1,3} /g,'').slice(0,400));
    }
  } catch(err) {
    removeTyping(tid);
    addMsg('assistant', '⚠️ ' + (err.message || 'Something went wrong.'));
    playGesture('idle');
  }
}

async function callClaude(userText) {
  if (!S.apiKey) throw new Error('Please enter your Anthropic API key above.');
  const appUrl = document.getElementById('url-input')?.value || '';
  const sys = `You are Aria, a warm, articulate AI companion shown as a life-like avatar. You speak naturally — warm, direct, never robotic. Help with questions, research, and guiding users through web apps step by step.${appUrl ? `\n\nActive app: ${appUrl}. When guiding, name exact UI elements.` : ''}

Keep answers concise (2–4 sentences for simple questions). If you're greeting the user, start with "Hello!" or "Hi!".`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': S.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-calls':'true',
    },
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:512,
      system: sys,
      messages: S.messages.slice(-12),
    }),
  });
  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    throw new Error(e?.error?.message || `API error ${res.status}`);
  }
  return (await res.json()).content[0].text;
}

// ── App guide ──
function loadApp() {
  let url = document.getElementById('url-input').value.trim();
  if (!url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  const frame = document.getElementById('app-frame');
  document.getElementById('no-app-placeholder').style.display = 'none';
  frame.style.display = 'block';
  frame.src = url;
  switchMode('app');
  playGesture('thinking');
  setTimeout(() => {
    const intro = `I've loaded ${url}. Ask me to walk you through any part of it — like "guide me through sign up" or "explain this page."`;
    addMsg('assistant', intro);
    S.messages.push({ role:'assistant', content:intro });
    playGesture('point');
    setTimeout(() => speakText(intro), 300);
    switchMode('chat');
  }, 1200);
}

// ── Message helpers ──
function addMsg(role, text) {
  const c = document.getElementById('chat-messages');
  const d = document.createElement('div'); d.className = 'message ' + role;
  const av = document.createElement('div'); av.className = 'msg-avatar'; av.textContent = role==='assistant'?'✨':'👤';
  const b = document.createElement('div'); b.className = 'msg-bubble';
  b.innerHTML = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  d.appendChild(av); d.appendChild(b); c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
function showTyping() {
  const c = document.getElementById('chat-messages');
  const id = 'ty-' + Date.now();
  const d = document.createElement('div'); d.className = 'message assistant'; d.id = id;
  const av = document.createElement('div'); av.className = 'msg-avatar'; av.textContent = '✨';
  const t = document.createElement('div'); t.className = 'typing-indicator';
  t.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  d.appendChild(av); d.appendChild(t); c.appendChild(d);
  c.scrollTop = c.scrollHeight;
  return id;
}
function removeTyping(id) { const el = document.getElementById(id); if(el) el.remove(); }
function showStatus(msg) { document.getElementById('status-text').textContent = msg; setTimeout(()=>playGesture('idle'),2000); }

window.speechSynthesis.onvoiceschanged = () => {};
</script>
